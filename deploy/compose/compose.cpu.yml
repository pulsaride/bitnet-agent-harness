services:
  bitnet:
    image: bitnet-cpu:milestone-a
    build:
      context: ../..
      dockerfile: docker/cpu/Dockerfile
    platform: linux/amd64
    restart: "no"
    ports:
      - "127.0.0.1:15842:15842"
    environment:
      MODEL_PATH: /models/ggml-model-i2_s.gguf
      MODEL_SHA256: "${MODEL_SHA256:?Run scripts/runtime-prepare-model.sh first}"
      BITNET_THREADS: "${BITNET_THREADS:-8}"
      BITNET_CONTEXT: "${BITNET_CONTEXT:-4096}"
      BITNET_MAX_PREDICT: "${BITNET_MAX_PREDICT:-256}"
      BITNET_TEMPERATURE: "${BITNET_TEMPERATURE:-0.8}"
    volumes:
      - type: bind
        source: "${MODEL_FILE:-../../docker/cpu/.cache/ggml-model-i2_s.gguf}"
        target: /models/ggml-model-i2_s.gguf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: 8.0
    mem_limit: 8g
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:15842/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
